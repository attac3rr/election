<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вибори Президента України · Kherson RP</title>
<style>
body{margin:0;background:#f4f5f3;color:#202a35;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 20px}
header{background:#17324d;color:#fff;border-top:3px solid #d9b44a;padding:24px 0}
h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#d2dce5;font-size:14px}
main{padding:24px 20px 48px}
.note{color:#586573;font-size:14px}
#status{font-weight:600;color:#17324d;margin:16px 0}
label{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #d9dee3;border-radius:6px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
label:has(input:checked){border-color:#17324d;background:#f0f4f8}
label img{width:56px;height:62px;object-fit:cover;border-radius:3px;background:#e9edf0}
label b{display:block}label span{color:#586573;font-size:14px}
input[type=radio]{width:20px;height:20px;margin:0 0 0 auto;flex:none}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:4px;background:#17324d;color:#fff;cursor:pointer}
button:disabled{background:#e7ebee;color:#586573;cursor:not-allowed}
#msg{margin-top:14px;padding:12px;border-radius:4px;background:#f0f4f8}
#msg.ok{background:#edf5ef;color:#246346}#msg.err{background:#fcf0ee;color:#9e302b}
.small{margin-top:40px;font-size:13px}.small a{color:#586573}
#admin{margin-top:16px;padding:18px;background:#fff;border:1px solid #d9dee3;border-radius:6px}
#admin input{font:inherit;padding:9px 10px;border:1px solid #7e8e9b;border-radius:4px;margin-right:8px}
.bar{height:8px;background:#e9edf0;border-radius:3px;margin:4px 0 12px}.bar i{display:block;height:8px;background:#17324d;border-radius:3px}
</style>
</head>
<body>
<header><div class="w"><h1>Вибори Президента України</h1><p id="tour"></p></div></header>
<main class="w">
  <p class="note">Голосування в межах рольового проєкту Kherson RP. Не є офіційними державними виборами.</p>
  <p id="status"></p>
  <div id="list">Завантаження…</div>
  <button id="btn" disabled>Проголосувати</button>
  <p id="msg" hidden></p>
  <p class="small"><a href="#" id="adm">Адміністратор</a></p>
  <div id="admin" hidden>
    <div id="login"><input type="password" id="pass" placeholder="Пароль" autocomplete="off"><button id="go">Увійти</button></div>
    <div id="res"></div>
  </div>
</main>
<script>
const API = 'ВСТАВТЕ_ПОСИЛАННЯ_З_GOOGLE';
const $ = (id) => document.getElementById(id);
const S = { sel: null, voted: false, busy: false, start: 0, end: 0, off: 0, tour: 1 };
const ERR = {
  not_started: 'Голосування ще не розпочалося.', ended: 'Голосування завершено.', already_voted: 'З цього пристрою або мережі вже проголосували.',
  bad_candidate: 'Такого кандидата немає. Оновіть сторінку.', bad_request: 'Некоректний запит. Оновіть сторінку.', server: 'Помилка сервера. Спробуйте пізніше.',
  wrong_code: 'Доступ заборонено.', locked: 'Забагато спроб. Зачекайте 15 хвилин.'
};
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
let cid = store.get('kh_id');
if (!cid) { cid = crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2); store.set('kh_id', cid); }

async function api(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data)) });
  const j = await r.json();
  if (j.error) throw Object.assign(new Error(j.error), { code: j.error });
  return j;
}
async function getIp() {
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 2500);
    const r = await fetch('https://api64.ipify.org?format=json', { signal: c.signal });
    return (await r.json()).ip || '';
  } catch (e) { return ''; }
}
const fmt = (t) => new Date(t).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' });
function msg(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; m.hidden = false; }

function render() {
  const n = Date.now() + S.off, p = n < S.start ? 0 : n >= S.end ? 2 : 1;
  const ok = p === 1 && !S.voted && !S.busy;
  $('status').textContent = S.voted ? 'Ваш голос прийнято. Дякуємо!' : p === 0 ? 'Голосування почнеться ' + fmt(S.start) : p === 2 ? 'Голосування завершено' : 'Голосування триває до ' + fmt(S.end);
  document.querySelectorAll('input[name=c]').forEach((i) => { i.disabled = !ok; });
  $('btn').disabled = !ok || !S.sel;
}

function showList(cands) {
  const list = $('list'); list.textContent = '';
  for (const c of cands) {
    const l = document.createElement('label'), box = document.createElement('div');
    if (/^https:\/\//.test(c.photo_url)) { const im = document.createElement('img'); im.alt = ''; im.src = c.photo_url; im.onerror = () => im.remove(); l.append(im); }
    const b = document.createElement('b'); b.textContent = c.name;
    const s = document.createElement('span'); s.textContent = c.party;
    box.append(b, s);
    const r = document.createElement('input'); r.type = 'radio'; r.name = 'c'; r.value = c.id;
    r.onchange = () => { S.sel = c.id; render(); };
    l.append(box, r); list.append(l);
  }
}

$('btn').onclick = async () => {
  S.busy = true; $('msg').hidden = true; render();
  try {
    await api('vote', { candidate_id: S.sel, client_id: cid, client_ip: await getIp() });
    S.voted = true; store.set('kh_voted_' + S.tour, '1'); msg('Ваш голос прийнято. Дякуємо за участь!', 'ok');
  } catch (e) {
    if (e.code === 'already_voted') { S.voted = true; store.set('kh_voted_' + S.tour, '1'); }
    msg(ERR[e.code] || 'Не вдалося надіслати голос. Спробуйте ще раз.', 'err');
  }
  S.busy = false; render();
};

$('adm').onclick = (e) => { e.preventDefault(); $('admin').hidden = !$('admin').hidden; };
$('go').onclick = async () => {
  const pass = $('pass').value; $('pass').value = '';
  try {
    const d = await api('admin', { code: pass, client_ip: await getIp() });
    const res = $('res'); res.textContent = '';
    const t = document.createElement('p'); t.textContent = 'Всього голосів: ' + d.total; t.style.fontWeight = '600'; res.append(t);
    for (const c of d.candidates) {
      const pct = d.total ? Math.round(c.votes * 100 / d.total) : 0;
      const row = document.createElement('div'); row.textContent = c.name + ' (' + c.party + ') — ' + c.votes + ' (' + pct + '%)';
      const bar = document.createElement('div'); bar.className = 'bar'; const f = document.createElement('i'); f.style.width = pct + '%'; bar.append(f);
      res.append(row, bar);
    }
    $('login').hidden = true;
  } catch (e) { $('res').textContent = ERR[e.code] || ERR.server; }
};

(async () => {
  try {
    const c = await api('config');
    S.start = c.start; S.end = c.end; S.tour = c.tour; S.off = c.now - Date.now();
    S.voted = store.get('kh_voted_' + S.tour) === '1';
    $('tour').textContent = ({ 1: 'Перший тур', 2: 'Другий тур' })[S.tour] || 'Тур ' + S.tour;
    showList(c.candidates);
  } catch (e) { $('list').textContent = 'Не вдалося завантажити кандидатів. Оновіть сторінку.'; }
  render(); setInterval(render, 10000);
})();
</script>
</body>
</html>
